name: Bug report
description: Report a defect or regression in the starter
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: locale
    attributes:
      label: Affected locale
      description: "e.g. en, no, tr"
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: "Exact commands or clicks"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
