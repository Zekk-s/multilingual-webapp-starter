name: Bug report
description: Report a failure in this repository
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: locale
    attributes:
      label: Locale
      description: "en, no, or tr, if the failure depends on one"
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: "Commands or pages"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
